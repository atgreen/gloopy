name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ make pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev protobuf-compiler \
            xvfb

      # The CI build is LEAN (GLOOPY_WITH_SURGE=OFF): fast, pure-AGPL, and it does
      # not need the Surge submodule. The Surge-enabled build is exercised by the
      # release workflow. This validates the core + unit tests + smoke.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLOOPY_WITH_SURGE=OFF -DGLOOPY_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      # Composition-as-repo relies on bit-reproducible renders. Render an example twice and
      # fail if the output isn't byte-identical (catches run-to-run nondeterminism). Headless
      # (offline bounce), so no X server needed.
      - name: Render determinism
        run: bash scripts/check-render-determinism.sh

      # Run the unit tests under ASan + UBSan (a separate Debug build with instrumentation) to
      # catch memory errors and undefined behavior in the DSP/logic code. -fno-sanitize-recover
      # makes UBSan fail the run on the first violation; leak detection is off (LSan needs ptrace
      # the runner may deny, and static-init "leaks" are benign).
      - name: Sanitized unit tests (ASan + UBSan)
        run: |
          cmake -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGLOOPY_WITH_SURGE=OFF -DGLOOPY_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined,address -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined,address"
          cmake --build build-san --target GloopyTests
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ASAN_OPTIONS=detect_leaks=0 \
            ctest --test-dir build-san --output-on-failure

      # Smoke drives the app over gRPC + renders audio offline. It needs grpcurl and
      # a virtual X server. Kept non-blocking (best-effort) since it depends on a
      # working headless audio/display stack in the runner.
      - name: Install grpcurl
        run: |
          GC=1.9.1
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v${GC}/grpcurl_${GC}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grpcurl

      - name: Smoke (headless, xvfb)
        continue-on-error: true
        run: xvfb-run -a bash tests/smoke.sh
