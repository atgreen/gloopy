# Build and publish the Gloopy manual to GitHub Pages, versioned with mike.
# Strategy: docs-as-code, Material for MkDocs, mike → gh-pages.
#
# The four reference generators (buf / OSC schema / 40ants-doc) are not wired up
# yet — their steps are left commented below so the deploy path works first with
# hand-written + mkdocstrings (inline) content. Uncomment each as it lands.

name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "proto/**"
      - "python/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: write   # mike pushes to the gh-pages branch

# Serialize against release.yaml's deploy-pages, which also pushes gh-pages on
# tags (the package repos live beside mike's manual on that branch).
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mike needs full history of gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt

      # Python client must be importable for mkdocstrings to pull its docstrings.
      - name: Install Python client
        run: pip install ./python

      # --- reference generators (pending) --------------------------------
      # - name: gRPC reference (buf → protoc-gen-doc)
      #   run: buf generate            # writes docs/control-scripting/reference/grpc/
      # - name: OSC reference (schema → Markdown)
      #   run: python tools/osc-docs.py osc.yaml docs/control-scripting/reference/osc/
      # - name: Common Lisp reference (40ants-doc)
      #   run: sbcl --script tools/build-lisp-docs.lisp
      # - name: Protocol safety
      #   run: buf lint && buf breaking --against ".git#tag=$(git describe --tags --abbrev=0 || echo HEAD)"
      # -------------------------------------------------------------------

      - name: Build (PR check — no deploy)
        if: github.event_name == 'pull_request'
        run: mkdocs build --strict

      - name: Configure git for mike
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # mike appends to the EXISTING gh-pages history (versions.json + the version dirs,
      # plus the landing page and the rpm repo that live on that branch). actions/checkout
      # fetches origin/gh-pages only as a remote-tracking ref — it creates NO local gh-pages
      # branch — and mike operates on the local branch. Without a local gh-pages, mike starts
      # a fresh ORPHAN and force-replaces the remote, wiping every previously-published
      # version and the rpm repo. Materialise a local gh-pages from the remote first; on the
      # first-ever run there is nothing to fetch and mike creates the branch as before.
      - name: Make existing gh-pages available to mike (so it appends, not orphans)
        if: github.event_name == 'push'
        run: git fetch origin gh-pages:gh-pages || echo "no gh-pages branch yet — mike will create it"

      # Doc versions track the PROTOCOL version, not the app version. mike deploys the
      # manual into versioned subdirs (/dev/, /latest/, ...). It does NOT own the site
      # root: no `mike set-default` / redirect — the root is the hand-built landing page
      # (landing/index.html), published over the top in the next step.
      - name: Deploy versioned docs
        if: startsWith(github.ref, 'refs/tags/v')
        run: mike deploy --push --update-aliases "${GITHUB_REF_NAME#v}" latest

      # Pushes to main publish a rolling "dev" build.
      - name: Deploy dev docs
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push dev

      # The site ROOT (https://atgreen.github.io/gloopy/) is the landing page, published
      # onto the gh-pages root with keep_files so mike's versioned docs + the rpm/deb repos
      # published by release.yaml are all preserved side by side.
      - name: Publish landing page to the Pages root
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./landing
          keep_files: true
          commit_message: "site: publish landing page"
