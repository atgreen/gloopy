#
# Windows build (Wave 10 #32). CI-native: MSVC + vcpkg for gRPC/protobuf.
# Builds a lean Gloopy.exe (GLOOPY_WITH_SURGE=OFF — the Linux .lv2 Surge bundle
# and pkg-config paths are Linux-only; see the CMake WIN32 guards), then proves it
# renders a non-silent, bit-reproducible WAV headlessly (no display needed).
#
# NOTE: this workflow is the initial Windows port and is expected to iterate on the
# GitHub Windows runner (vcpkg gRPC resolution + MSVC codegen quirks) — it cannot be
# validated from the Linux dev box. The core render proof reuses the same
# scripts/check-render-determinism.sh the Linux CI runs, via Git Bash.
name: Windows

# NOT on every push: vcpkg builds grpc from source (~hours the first time), so running
# it per-push is untenable. Runs on PRs to main and on demand; the vcpkg binary cache
# below makes runs after the first fast.
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push vcpkg binary packages to the GitHub Packages NuGet feed (durable cache)

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # vcpkg binary caching: build each component (grpc + abseil/protobuf/openssl/re2/c-ares/zlib)
      # ONCE, then restore the prebuilt package and skip its build on every later run. Two tiers:
      #   * nuget on GitHub Packages — DURABLE: not subject to the Actions-cache 10 GB / 7-day
      #     eviction, so once grpc is seeded it is restored indefinitely (the persistence we need).
      #   * x-gha (Actions cache) — fast local tier, but evictable; a backstop, not the source of truth.
      # Restoring skips the giant from-source buildtree entirely, which is what avoids the disk
      # exhaustion (LNK1180) that killed the seeding run — see the Install gRPC step.
      VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite;x-gha,readwrite"
      SCCACHE_GHA_ENABLED: "true"   # sccache stores compiled objects in the GHA cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The single biggest Windows-CI speedup: Defender real-time scanning of every .obj/.pch/
      # .exe the compiler writes dominates C++ build I/O. Best-effort (tamper protection may block).
      - name: Disable Windows Defender real-time protection
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Ninja needs cl.exe on PATH (the VS generator finds it itself; Ninja doesn't). Also
      # brings ninja.exe from the VS install onto PATH.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Compiler cache: skip recompiling unchanged translation units across runs.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      # x-gha (the vcpkg GHA cache backend) needs these runner-internal vars exported.
      - name: Enable vcpkg binary caching
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      # Durable binary cache: authenticate vcpkg's nuget against the repo's GitHub Packages
      # feed so each built component is PUSHED there and RESTORED on later runs (survives the
      # Actions-cache eviction). Uses the job's GITHUB_TOKEN; the source name matches
      # VCPKG_BINARY_SOURCES above. Best-effort: a fork PR has no packages:write, so tolerate failure.
      - name: Set up NuGet binary cache (GitHub Packages)
        shell: pwsh
        continue-on-error: true
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $feed = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          $nuget = & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" fetch nuget | Select-Object -Last 1
          & $nuget sources add -Source $feed -Name GitHubPackages -Username "${{ github.repository_owner }}" -Password "$env:GH_PACKAGES_TOKEN" -StorePasswordInClearText
          & $nuget setapikey "$env:GH_PACKAGES_TOKEN" -Source $feed

      # Free space on C: before the (cache-cold) seed build. The runner leaves only ~14 GB
      # free; the from-source grpc build overflowed it once (LNK1180). Removing the large,
      # unused Android SDK reclaims ~9 GB — enough headroom for the release-only seed build.
      # Once the NuGet cache is seeded, later runs restore prebuilts and skip this pressure.
      - name: Free up disk space
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($p in @("C:\Android", "${env:ANDROID_SDK_ROOT}", "${env:ANDROID_HOME}")) {
            if ($p -and (Test-Path $p)) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-PSDrive C | Format-Table Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      # gRPC + protobuf via the vcpkg pre-installed on the runner ($VCPKG_INSTALLATION_ROOT).
      # This is the long pole; grpc pulls protobuf/abseil/re2/c-ares/zlib/openssl.
      # With the caches above, the FIRST run seeds them (from source); every later run restores
      # the prebuilt packages and skips this build entirely.
      - name: Install gRPC (vcpkg)
        shell: pwsh
        run: |
          Get-PSDrive C | Format-Table Name,@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          # x64-windows-release (ci/triplets) is release-only — the default x64-windows builds
          # every dep twice (debug + release), which is most of the multi-hour build. --clean-*
          # -after-build additionally keeps peak disk down (grpc pulls openssl/protobuf/abseil/...).
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install grpc:x64-windows-release `
            --overlay-triplets="$env:GITHUB_WORKSPACE/ci/triplets" `
            --clean-buildtrees-after-build --clean-downloads-after-build
          Get-PSDrive C | Format-Table Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      # Ninja (not MSBuild) — lighter scheduling, and it supports CMAKE_*_COMPILER_LAUNCHER so
      # sccache can wrap cl.exe. CMAKE_BUILD_TYPE=Release (Ninja is single-config).
      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-release
          -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/ci/triplets"
          -DGLOOPY_WITH_SURGE=OFF -DGLOOPY_TESTS=ON

      - name: Build
        run: cmake --build build   # Ninja parallelises across all cores by default

      - name: Unit tests (ctest)
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Boot + render proof: bounce an example project twice offline and assert the
      # output WAV is byte-identical (non-silent + bit-reproducible). Git Bash ships
      # sha256sum/mktemp on windows-latest. The .exe lives in the multi-config Release dir.
      - name: Render proof (headless)
        shell: bash
        env:
          GLOOPY_BIN: build/Gloopy_artefacts/Release/gloopy.exe
        run: bash scripts/check-render-determinism.sh
