# SPDX-FileCopyrightText: 2026 Anthony Green <green@moxielogic.com>
# SPDX-License-Identifier: AGPL-3.0-only
#
# Two ways to run this:
#   * Push a tag  v*      -> builds every package and ATTACHES them to the GitHub
#                            Release for that tag (RPM, DEB, and the Windows zip).
#   * Run manually (Actions -> Release -> Run workflow) -> builds "test packages"
#                            and uploads them as downloadable workflow ARTIFACTS
#                            only — nothing is published to a Release. Use the
#                            "packages" input to build just linux or just windows
#                            for a quick check (grpc:x64-windows via vcpkg is slow).
#
# The "Upload to release" steps are tag-only; the "Upload artifact" steps always run,
# so a manual dispatch is the supported way to produce a package to test before tagging.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      packages:
        description: 'Which test packages to build'
        type: choice
        options: [all, linux, windows]
        default: all

permissions:
  contents: write   # create the GitHub release + upload assets (tag runs only)
  packages: write   # push vcpkg binary packages to the GitHub Packages NuGet feed (durable cache)

jobs:
  # =====================================================================
  # RPM (Fedora) — full build WITH the embedded Surge XT synth.
  # =====================================================================
  rpm:
    if: ${{ github.event_name == 'push' || github.event.inputs.packages == 'all' || github.event.inputs.packages == 'linux' }}
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cmake ninja-build gcc-c++ make rpm-build pkgconf-pkg-config \
            alsa-lib-devel freetype-devel libX11-devel libXrandr-devel \
            libXinerama-devel libXcursor-devel libXext-devel \
            mesa-libGL-devel libXrender-devel libXi-devel \
            grpc-devel grpc-plugins protobuf-devel protobuf-compiler \
            perl which

      - name: Checkout
        uses: actions/checkout@v4

      # Init ONLY the Surge sub-libs surge-common needs (NOT JUCE). init-surge.sh
      # also inits the third_party/surge submodule itself.
      - name: Initialize Surge source
        run: |
          # The container runs as root over a checkout actions/checkout made as another user,
          # so git rejects it as "dubious ownership" — trust the workspace for the git steps.
          git config --global --add safe.directory '*'
          bash scripts/init-surge.sh

      # Build the full Surge XT LV2 plugin and stage it at third_party/surge-plugin/, so the
      # CMake install rule (if(EXISTS ...), evaluated at configure time) bundles it — this MUST
      # run before "Configure + build" for that rule to fire.
      - name: Build bundled Surge XT plugin
        run: bash scripts/build-surge-plugin.sh

      # Gather the vendored/bundled third-party license texts into ./licenses/ BEFORE
      # configure (the install rule's EXISTS check is configure-time). They then ship in
      # the package via the gloopy component (share/doc/gloopy/third-party-licenses).
      - name: Collect third-party licenses
        run: bash packaging/collect-licenses.sh

      - name: Configure + build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Traditional rpmbuild (packaging/gloopy.spec), NOT CPack — stages only the `gloopy`
      # install component into an FHS tree (no JUCE headers/juceaide/cmake configs).
      - name: Package RPM
        run: |
          git config --global --add safe.directory '*'
          rpmbuild -bb packaging/gloopy.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "debug_package %{nil}" \
            --define "_gloopy_srcdir $PWD" \
            --define "_gloopy_builddir $PWD/build"
          mkdir -p out && cp rpmbuild/RPMS/*/*.rpm out/
          rpm -qlp out/*.rpm | grep -c '/usr/include' | xargs -I{} echo "header files packaged (want 0): {}"

      - name: Upload to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: out/*.rpm

  # =====================================================================
  # DEB (Debian) — full build WITH the embedded Surge XT synth.
  # =====================================================================
  deb:
    if: ${{ github.event_name == 'push' || github.event.inputs.packages == 'all' || github.event.inputs.packages == 'linux' }}
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    env:
      # The debian:stable container defaults to the C/POSIX locale; cpack's DEB generator
      # then can't handle a UTF-8 factory-patch filename (Surge's "µcomputer.fxp") — "Can't
      # lstat". C.UTF-8 is built into glibc (no `locales` package needed). Fedora already
      # defaults to UTF-8, so the RPM job is fine.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build g++ make dpkg-dev debhelper fakeroot file pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev \
            libgl1-mesa-dev libxrender-dev libxi-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev protobuf-compiler

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Surge source
        run: |
          # The container runs as root over a checkout actions/checkout made as another user,
          # so git rejects it as "dubious ownership" — trust the workspace for the git steps.
          git config --global --add safe.directory '*'
          bash scripts/init-surge.sh

      # Build the full Surge XT LV2 plugin and stage it at third_party/surge-plugin/, so the
      # CMake install rule (if(EXISTS ...), evaluated at configure time) bundles it — this MUST
      # run before "Configure + build" for that rule to fire.
      - name: Build bundled Surge XT plugin
        run: bash scripts/build-surge-plugin.sh

      # Gather the vendored/bundled third-party license texts into ./licenses/ BEFORE
      # configure (the install rule's EXISTS check is configure-time). They then ship in
      # the package via the gloopy component (share/doc/gloopy/third-party-licenses).
      - name: Collect third-party licenses
        run: bash packaging/collect-licenses.sh

      - name: Configure + build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Traditional dpkg-buildpackage (debian/), NOT CPack — override_dh_auto_install stages
      # only the `gloopy` install component (FHS layout). -d skips the Build-Depends check
      # (deps are installed above); the .deb lands in the parent dir.
      - name: Package DEB
        run: |
          git config --global --add safe.directory '*'
          dpkg-buildpackage -b -us -uc -d
          mkdir -p out && cp ../gloopy_*.deb out/
          dpkg-deb -c out/*.deb | grep -c '/usr/include' | xargs -I{} echo "header files packaged (want 0): {}"

      - name: Upload to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: out/*.deb

  # =====================================================================
  # Windows (x64) — a portable zip: the .exe, its vcpkg runtime DLLs, the bundled
  # assets, and the featured Surge XT synth as a VST3 (Windows hosts VST3, not the
  # Linux .lv2). gloopy itself is built lean (GLOOPY_WITH_SURGE=OFF, no embedded
  # core) like the Windows CI; Surge is hosted from the bundled VST3 instead.
  # =====================================================================
  windows:
    if: ${{ github.event_name == 'push' || github.event.inputs.packages == 'all' || github.event.inputs.packages == 'windows' }}
    runs-on: windows-latest
    env:
      # Binary cache, two tiers: nuget on GitHub Packages is DURABLE (survives the Actions-cache
      # 10 GB / 7-day eviction), so grpc + its deps are built ONCE and restored forever; x-gha is
      # a fast, evictable backstop. Restoring skips the from-source build that exhausted disk.
      VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite;x-gha,readwrite"
      SCCACHE_GHA_ENABLED: "true"   # sccache stores compiled objects in the GHA cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The single biggest Windows-CI speedup: Defender real-time scanning of every .obj/.pch/
      # .exe the compiler writes dominates C++ build I/O. Best-effort (tamper protection may block).
      - name: Disable Windows Defender real-time protection
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Ninja needs cl.exe on PATH (the VS generator finds it itself; Ninja doesn't). Also
      # brings ninja.exe from the VS install onto PATH.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Compiler cache: skip recompiling unchanged translation units across runs.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      # x-gha (the vcpkg GHA cache backend) needs these runner-internal vars exported.
      - name: Enable vcpkg binary caching
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      # Durable binary cache: authenticate vcpkg's nuget against the repo's GitHub Packages feed
      # (source name matches VCPKG_BINARY_SOURCES). Seeded once, restored on every later run.
      - name: Set up NuGet binary cache (GitHub Packages)
        shell: pwsh
        continue-on-error: true
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $feed = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          $nuget = & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" fetch nuget | Select-Object -Last 1
          & $nuget sources add -Source $feed -Name GitHubPackages -Username "${{ github.repository_owner }}" -Password "$env:GH_PACKAGES_TOKEN" -StorePasswordInClearText
          & $nuget setapikey "$env:GH_PACKAGES_TOKEN" -Source $feed

      # Reclaim disk before the cache-cold seed build (the runner leaves only ~14 GB free;
      # a from-source grpc build overflowed it once). The unused Android SDK is ~9 GB.
      - name: Free up disk space
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($p in @("C:\Android", "${env:ANDROID_SDK_ROOT}", "${env:ANDROID_HOME}")) {
            if ($p -and (Test-Path $p)) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-PSDrive C | Format-Table Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      # gRPC + protobuf via the vcpkg pre-installed on the runner. This is the long
      # pole (grpc pulls protobuf/abseil/re2/c-ares/zlib/openssl) — hence a manual
      # dispatch can pick `packages: linux` to skip it. With the caches above, only the
      # first run builds from source; later runs restore the prebuilts.
      - name: Install gRPC (vcpkg)
        shell: pwsh
        run: |
          Get-PSDrive C | Format-Table Name,@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          # x64-windows-release (ci/triplets) is release-only — the default x64-windows builds
          # every dep twice (debug + release), which is most of the multi-hour build. --clean-*
          # -after-build additionally keeps peak disk down (grpc pulls openssl/protobuf/abseil/...).
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install grpc:x64-windows-release `
            --overlay-triplets="$env:GITHUB_WORKSPACE/ci/triplets" `
            --clean-buildtrees-after-build --clean-downloads-after-build
          Get-PSDrive C | Format-Table Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      # Ninja (not MSBuild) — lighter scheduling, and it supports CMAKE_*_COMPILER_LAUNCHER so
      # sccache can wrap cl.exe. CMAKE_BUILD_TYPE=Release (Ninja is single-config).
      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-release
          -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/ci/triplets"
          -DGLOOPY_WITH_SURGE=OFF

      - name: Build
        run: cmake --build build   # Ninja parallelises across all cores by default

      # Build the featured Surge XT synth as a VST3 and stage it (+ its first-party
      # factory data) at third_party/surge-plugin/. Heavy (Surge + JUCE) — this and the
      # vcpkg-grpc step are why the Windows job is slow; a manual dispatch can pick
      # `packages: linux` to skip both. Runs under Git Bash (find/cp/tar), MSVC compile.
      - name: Build bundled Surge XT (VST3)
        shell: bash
        run: bash scripts/build-surge-vst3.sh

      # Gather the vendored/bundled third-party license texts into ./licenses/ (Git Bash).
      - name: Collect third-party licenses
        shell: bash
        run: bash packaging/collect-licenses.sh

      # Assemble a self-contained folder. The vcpkg toolchain (app-local deps) copies
      # the dependent DLLs next to gloopy.exe at build time, so the Release artefact dir
      # is already runnable; we add the vendored assets exe-adjacent, because the
      # compile-time GLOOPY_ASSETS_DIR points at this build machine's source tree and
      # won't exist on an end user's machine — gloopy.exe then finds them at
      # <exeDir>/assets/... instead.
      - name: Stage portable zip
        shell: pwsh
        run: |
          $stage = "staging/gloopy-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/Gloopy_artefacts/Release/* $stage -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$stage/assets" | Out-Null
          Copy-Item third_party/SalamanderGrandPiano "$stage/assets/" -Recurse -Force
          # Bundled Surge XT VST3 (+ its SurgeXTData) beside gloopy.exe, in plugins/ — the
          # dir PluginHost scans (<exeDir>/plugins). Surge finds its data via the plugins/
          # sibling by walking up from its DLL. Fail if the VST3 build didn't produce it.
          if (-not (Test-Path "third_party/surge-plugin/*.vst3")) {
            throw "no Surge VST3 staged at third_party/surge-plugin/ — did build-surge-vst3.sh run?"
          }
          New-Item -ItemType Directory -Force -Path "$stage/plugins" | Out-Null
          Copy-Item third_party/surge-plugin/* "$stage/plugins/" -Recurse -Force
          # Third-party license texts: the collected in-tree set + the manifest, plus the
          # vcpkg-linked deps' copyrights (grpc/protobuf/abseil/... are statically linked on
          # Windows, unlike Linux where the system packages carry them).
          New-Item -ItemType Directory -Force -Path "$stage/licenses" | Out-Null
          Copy-Item THIRD-PARTY-LICENSES.md "$stage/licenses/" -Force
          Copy-Item licenses/* "$stage/licenses/" -Recurse -Force
          $vcpkgShare = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-release/share"
          if (Test-Path $vcpkgShare) {
            Get-ChildItem $vcpkgShare -Directory | ForEach-Object {
              $cr = Join-Path $_.FullName "copyright"
              if (Test-Path $cr) {
                $d = "$stage/licenses/vcpkg/$($_.Name)"
                New-Item -ItemType Directory -Force -Path $d | Out-Null
                Copy-Item $cr $d -Force
              }
            }
          }
          @"
          Gloopy - portable Windows build (x64)

          Run gloopy.exe. This is self-contained: the app plus its runtime DLLs and
          bundled assets, including the Surge XT synth (in plugins\). Needs the
          Microsoft Visual C++ 2015-2022 Redistributable (x64) if it isn't already
          installed.

          + Synth -> Surge XT (full editor) works out of the box, alongside the
          built-in Basic synth, the sampler, SFZ instruments, and hosted VST3 plugins.
          "@ | Set-Content -Path "$stage/README.txt" -Encoding utf8
          Compress-Archive -Path $stage -DestinationPath gloopy-windows-x64.zip -Force

      # Prove the staged build launches and renders (its DLLs resolve). Git Bash ships
      # sha256sum/mktemp on windows-latest; the render proof is the same script Linux CI runs.
      - name: Render proof (from the staged build)
        shell: bash
        env:
          GLOOPY_BIN: staging/gloopy-windows-x64/gloopy.exe
        run: bash scripts/check-render-determinism.sh

      - name: Upload to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: gloopy-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: gloopy-windows-x64.zip

  # =====================================================================
  # Package repositories, hosted on GitHub Pages (like the icl repos).
  #
  # These run on a TAG push only — they turn the RPM/DEB attached to the
  # GitHub Release into installable dnf/apt repositories:
  #   * RPM: createrepo_c metadata whose <location> hrefs point back at the
  #          Release download URLs, so Pages serves only the small metadata
  #          and the .rpm bytes come from the Release.
  #   * DEB: a pool/ + dists/ tree that carries the .deb itself.
  # deploy-pages pushes both into the gh-pages branch (under rpm-repo/ and
  # deb-repo/), alongside the mike-published manual — a plain branch push,
  # so it works even before the repo is public / Pages is enabled.
  #
  # GPG signing is optional: set the RPM_GPG_PRIVATE_KEY secret (base64 of an
  # ASCII-armored private key — the same one icl uses) to sign the repo
  # metadata; without it the repos publish unsigned and clients need
  # gpgcheck=0 / an unsigned apt source.
  # =====================================================================
  build-rpm-repo:
    needs: rpm
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install createrepo_c
        run: sudo apt-get update && sudo apt-get install -y createrepo-c

      - name: Download RPM built earlier in this run
        uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: /tmp/rpms

      - name: Build repodata
        run: createrepo_c /tmp/rpms

      # The .rpm is a Release asset, not served from Pages — rewrite the repodata
      # hrefs to the Release download URL so dnf fetches the package from there.
      - name: Rewrite package locations to release asset URLs
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          cd /tmp/rpms/repodata

          gunzip -f *-primary.xml.gz
          PRIMARY=$(ls *-primary.xml)
          sed -i "s|<location href=\"\([^\"]*\.rpm\)\"|<location href=\"${BASE}/\1\"|g" "${PRIMARY}"
          gzip -9 "${PRIMARY}"

          # Rebuild repomd.xml with the recompressed files' checksums/sizes.
          cd /tmp/rpms
          REPODATA=repodata
          cat > "${REPODATA}/repomd.xml" <<'XMLHEADER'
          <?xml version="1.0" encoding="UTF-8"?>
          <repomd xmlns="http://linux.duke.edu/metadata/repo">
          XMLHEADER
          for gz in "${REPODATA}"/*.xml.gz; do
            fname="$(basename "${gz}")"
            type="$(echo "${fname}" | sed 's/.*-\([a-z_]*\)\.xml\.gz/\1/')"
            checksum="$(sha256sum "${gz}" | awk '{print $1}')"
            size="$(stat -c%s "${gz}")"
            open_file="${gz%.gz}"
            gunzip -k -f "${gz}"
            open_checksum="$(sha256sum "${open_file}" | awk '{print $1}')"
            open_size="$(stat -c%s "${open_file}")"
            rm -f "${open_file}"
            cat >> "${REPODATA}/repomd.xml" <<XMLDATA
            <data type="${type}">
              <checksum type="sha256">${checksum}</checksum>
              <open-checksum type="sha256">${open_checksum}</open-checksum>
              <location href="repodata/${fname}"/>
              <size>${size}</size>
              <open-size>${open_size}</open-size>
            </data>
          XMLDATA
          done
          echo "</repomd>" >> "${REPODATA}/repomd.xml"
          sed -i 's/^          //' "${REPODATA}/repomd.xml"

      - name: Sign repomd.xml and export public key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "${RPM_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          gpg --batch --detach-sign --armor /tmp/rpms/repodata/repomd.xml
          gpg --batch --export --armor > /tmp/rpms/RPM-GPG-KEY-gloopy

      # Assemble the exact directory that will be served at /gloopy/rpm-repo:
      # the metadata, the .repo client config, and the signing key (if any).
      - name: Assemble rpm-repo dir
        run: |
          mkdir -p rpm-repo
          cp -r /tmp/rpms/repodata rpm-repo/
          cp packaging/gloopy.repo rpm-repo/gloopy.repo
          [ -f /tmp/rpms/RPM-GPG-KEY-gloopy ] && cp /tmp/rpms/RPM-GPG-KEY-gloopy rpm-repo/ || true
          find rpm-repo -type f | sort

      - name: Upload rpm-repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-repo
          path: rpm-repo

  build-deb-repo:
    needs: deb
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Install APT repo tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gpg

      - name: Download DEB built earlier in this run
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: /tmp/debs

      - name: Import GPG key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "${RPM_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          # apt's signed-by expects the ASCII-armored key; name matches the URL in install docs.
          gpg --batch --export --armor > /tmp/debs/gloopy-archive-keyring.gpg

      - name: Build APT repository
        run: |
          REPO_DIR=/tmp/apt-repo
          mkdir -p "${REPO_DIR}/pool/main" "${REPO_DIR}/dists/stable/main/binary-amd64"
          cp /tmp/debs/*.deb "${REPO_DIR}/pool/main/"

          cd "${REPO_DIR}"
          dpkg-scanpackages pool/main > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz

          cd dists/stable
          cat > Release <<EOF
          Origin: gloopy
          Label: gloopy
          Suite: stable
          Codename: stable
          Date: $(date -Ru)
          Architectures: amd64
          Components: main
          Description: Gloopy APT repository
          EOF
          sed -i 's/^          //' Release
          {
            echo "MD5Sum:"
            for f in main/binary-amd64/Packages main/binary-amd64/Packages.gz; do
              printf " %s %16d %s\n" "$(md5sum "$f" | awk '{print $1}')" "$(stat -c%s "$f")" "$f"
            done
            echo "SHA256:"
            for f in main/binary-amd64/Packages main/binary-amd64/Packages.gz; do
              printf " %s %16d %s\n" "$(sha256sum "$f" | awk '{print $1}')" "$(stat -c%s "$f")" "$f"
            done
          } >> Release

      - name: Sign Release file
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "${RPM_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          cd /tmp/apt-repo/dists/stable
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          gpg --batch --yes --armor --clearsign -o InRelease Release

      - name: Copy keyring into repo
        run: |
          [ -f /tmp/debs/gloopy-archive-keyring.gpg ] && cp /tmp/debs/gloopy-archive-keyring.gpg /tmp/apt-repo/ || true
          find /tmp/apt-repo -type f | sort

      - name: Upload deb-repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-repo
          path: /tmp/apt-repo

  # Push both repos into the gh-pages branch (under rpm-repo/ and deb-repo/),
  # keeping the mike-published manual that already lives there. A plain branch
  # push via peaceiris — no Pages-enabled dependency, so it works while the repo
  # is still private; it starts serving once the repo is public + Pages is on.
  deploy-pages:
    needs: [build-rpm-repo, build-deb-repo]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # Serialize against docs.yml (mike), which also pushes gh-pages on tags.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Download rpm-repo
        uses: actions/download-artifact@v4
        with:
          name: rpm-repo
          path: public/rpm-repo

      - name: Download deb-repo
        uses: actions/download-artifact@v4
        with:
          name: deb-repo
          path: public/deb-repo

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true   # preserve the mike-published manual (and each other)
          commit_message: "repo: publish rpm/deb repositories for ${{ github.ref_name }}"
