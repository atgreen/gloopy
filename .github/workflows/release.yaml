name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release + upload assets

jobs:
  # =====================================================================
  # RPM (Fedora) — full build WITH the embedded Surge XT synth.
  # =====================================================================
  rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cmake ninja-build gcc-c++ make rpm-build \
            alsa-lib-devel freetype-devel libX11-devel libXrandr-devel \
            libXinerama-devel libXcursor-devel libXext-devel \
            grpc-devel grpc-plugins protobuf-devel protobuf-compiler \
            perl which

      - name: Checkout
        uses: actions/checkout@v4

      # Init ONLY the Surge sub-libs surge-common needs (NOT JUCE). init-surge.sh
      # also inits the third_party/surge submodule itself.
      - name: Initialize Surge source
        run: bash scripts/init-surge.sh

      - name: Configure + build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package RPM
        run: cd build && cpack -G RPM

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: build/*.rpm

  # =====================================================================
  # DEB (Debian) — full build WITH the embedded Surge XT synth.
  # =====================================================================
  deb:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build g++ make dpkg-dev file \
            libasound2-dev libfreetype-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev protobuf-compiler

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Surge source
        run: bash scripts/init-surge.sh

      - name: Configure + build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package DEB
        run: cd build && cpack -G DEB

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb
