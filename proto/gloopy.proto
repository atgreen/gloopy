syntax = "proto3";
package gloopy.v1;

// Gloopy control API — the gRPC command surface (structural, scheduled,
// queries). Real-time performance (live notes/CC) is on the OSC lane.

message Empty {}
message TemplateRef  { string name = 1; }
message TemplateList { repeated string names = 1; }
message Ack { bool ok = 1; string error = 2; }

// ── transport ──────────────────────────────────────────────
message Tempo    { double bpm = 1; }
message Swing    { double amount = 1; }   // 0.5 = straight, up to ~0.75 = triplet feel
message Position { double beats = 1; }

// ── tempo map ──────────────────────────────────────────────
message TempoMarker  { double beat = 1; double bpm = 2; }
message TempoMap     { repeated TempoMarker markers = 1; }
message TimeSignature { int32 numerator = 1; int32 denominator = 2; double beats_per_bar = 3; }
message BeatPos      { double beat = 1; }
message BarBeat      { int32 bar = 1; double beat_in_bar = 2; }   // both 1-based ("1.1")
message SecondsValue { double seconds = 1; }
message Loop     { bool enabled = 1; double start_beat = 2; double end_beat = 3; }
message TransportState { bool playing = 1; double bpm = 2; double position_beats = 3;
                         bool loop_enabled = 4; double loop_start = 5; double loop_end = 6;
                         bool metronome = 7; double swing = 8; }
message MetronomeRequest { bool enabled = 1; }

// ── notes / clips ──────────────────────────────────────────
message Note {
  int32  pitch        = 1;   // MIDI 0-127
  double start_beat   = 2;   // within the clip
  double length_beats = 3;
  float  velocity     = 4;   // 0..1
}

enum Waveform { SINE = 0; SAW = 1; SQUARE = 2; TRIANGLE = 3; }

message AddSynthTrackRequest {
  string   name    = 1;
  Waveform wave    = 2;
  float    attack  = 3;
  float    decay   = 4;
  float    sustain = 5;
  float    release = 6;
  float    gain    = 7;
}
message TrackId { int32 id = 1; }

// ── audio recording ────────────────────────────────────────
message AudioInputs { repeated string names = 1; }
message ArmRequest  { int32 track_id = 1; bool armed = 2; int32 input = 3; int32 channels = 4; bool monitor = 5; }
message PunchRange  { bool enabled = 1; double in_beat = 2; double out_beat = 3; double count_in_beats = 4; }
message RecordSettings { int32 format = 1; double latency_offset_seconds = 2; }   // format: 0 WAV, 1 FLAC
message TakeRef        { string take_id = 1; }
message TakeCount      { int32 count = 1; }

// Live tweak of the built-in synth engine on a track. `name` is one of:
// wave osc2wave osc2detune oscmix sub attack decay sustain release gain
// ftype cutoff reso fenvamt fattack fdecay fsustain frelease lfotarget lforate lfodepth
message SynthParamSet { int32 track_id = 1; string name = 2; float value = 3; }

message TrackParams {
  int32 id = 1;
  optional float  volume = 2;
  optional float  pan    = 3;
  optional bool   mute   = 4;
  optional bool   solo   = 5;
  optional string name   = 6;
}

message TrackInfo {
  int32  id = 1; string name = 2; string type = 3;
  float  volume = 4; float pan = 5; bool mute = 6; int32 clips = 7;
}
message TrackList { repeated TrackInfo tracks = 1; }

message AddClipRequest {
  int32  track_id          = 1;
  double start_beat        = 2;
  double length_beats      = 3;
  double content_len_beats = 4;
  bool   looped            = 5;
  repeated Note notes      = 6;
  string name              = 7;
}
message ClipId { int32 track_id = 1; int32 index = 2; }

// ── mixer / effects ────────────────────────────────────────
enum EffectType { GAIN = 0; FILTER = 1; DELAY = 2; REVERB = 3; LIMITER = 4; BITCRUSHER = 5; COMPRESSOR = 6; EQ = 7; WAVESHAPER = 8; STEREO_WIDENER = 9; CHORUS = 10; FLANGER = 11; PHASER = 12; }
message EffectInfo  { int32 slot = 1; string name = 2; bool bypassed = 3; }
message Send { int32 bus = 1; float level = 2; }   // aux send: insert -> bus at level
message MixerInsert {
  int32 index = 1; string name = 2; float volume = 3; float pan = 4;
  bool mute = 5; bool solo = 6; repeated EffectInfo effects = 7;
  bool is_bus = 8; repeated Send sends = 9;
}
message AddBusRequest  { string name = 1; }
message SetSendRequest { int32 insert = 1; int32 bus = 2; float level = 3; }   // level<=0 removes
message InsertList  { repeated MixerInsert inserts = 1; }
message InsertParams {
  int32 index = 1;
  optional float  volume = 2;
  optional float  pan    = 3;
  optional bool   mute   = 4;
  optional bool   solo   = 5;
}
message EffectRef   { int32 insert = 1; int32 slot = 2; }
message AddEffectRequest { int32 insert = 1; EffectType type = 2; }
message EffectParamSet   { int32 insert = 1; int32 slot = 2; string name = 3; float value = 4; }
message EffectBypassSet  { int32 insert = 1; int32 slot = 2; bool bypassed = 3; }
message Param     { string name = 1; float value = 2; float min = 3; float max = 4; }
message ParamList { repeated Param params = 1; }
message SceneName { string name = 1; }
message SceneList { repeated string names = 1; }

// ── control groups (VCA-lite) ──────────────────────────────
message ControlGroupGain { string name = 1; float gain = 2; }        // gain 0..1 (also defines the group)
message ControlGroupMute { string name = 1; bool mute = 2; }
message GroupAssign      { int32 insert = 1; string group = 2; }     // group="" clears membership
message GroupName        { string name = 1; }
message ControlGroupInfo { string name = 1; float gain = 2; bool mute = 3; int32 members = 4; }
message ControlGroupList { repeated ControlGroupInfo groups = 1; }

// ── universal parameter model ──────────────────────────────
// A single flat, stable, string-addressed descriptor for any automatable value.
// id grammar:
//   track/<id>/{volume|pan|mute|solo}        insert/<index>/{volume|pan|mute|solo}
//   track/<id>/synth/<name>                  effect/<insert>/<slot>/<paramName>
message ParameterInfo {
  string id      = 1;
  string name    = 2;   // human label
  float  value   = 3;
  float  min           = 4;
  float  max           = 5;
  float  default_value = 6;
  string unit          = 7;   // "", "dB", "Hz", "s", "st", ...
  string scaling = 8;   // "linear" | "log" | "bool" | "enum"
}
message ParameterList { repeated ParameterInfo params = 1; }
message ParameterId   { string id = 1; }
message ParameterSet  { string id = 1; float value = 2; }

// ── controller mapping / MIDI-learn ────────────────────────
// source: "cc:<n>" (MIDI CC), "osc:<name>", or any string; drives `target` (a
// ParameterInfo.id), scaling the 0..1 input to [lo, hi].
message ControllerMap    { string source = 1; string target = 2; float lo = 3; float hi = 4; bool bypass = 5; }   // lo>hi inverts
message ControllerList   { repeated ControllerMap maps = 1; }
message ControllerBypass { string source = 1; string target = 2; bool bypass = 3; }
message ControllerSource { string source = 1; }
message ControllerValue  { string source = 1; float value = 2; }   // value 0..1
message LearnRequest     { string target = 1; }                    // arm learn for the next controller

// ── scales ─────────────────────────────────────────────────
// root: 0=C .. 11=B. Set by intervals, or by a built-in `name` (major, minor,
// dorian, pentatonic-minor, blues, whole-tone, chromatic, ...).
message Scale { int32 root = 1; string name = 2; repeated int32 intervals = 3; }

// ── timeline locations ─────────────────────────────────────
// A named point or span on the timeline. kind: "marker" | "range" | "section" |
// "loop" | "punch" | "export" | "skip". For a marker, end_beat collapses to start.
message TimelineLocation { string name = 1; string kind = 2; double start_beat = 3; double end_beat = 4; }
message LocationList { repeated TimelineLocation locations = 1; }
message LocationName { string name = 1; }

// ── export profiles (named render targets) ─────────────────
// target: "mix" | "range" (+range_name) | "track" (+track_id) | "stems".
// Output goes to <project>/exports/ (or out_dir), filenames deterministic.
message ExportProfile {
  string name = 1; string target = 2; string range_name = 3;
  int32 track_id = 4; string format = 5; double tail_seconds = 6;
}
message ExportProfileList { repeated ExportProfile profiles = 1; }
message ExportName   { string name = 1; }
message ExportRun    { string name = 1; string out_dir = 2; }   // out_dir overrides <project>/exports
message ExportResult { bool ok = 1; string error = 2; repeated string files = 3; }

// ── presets ────────────────────────────────────────────────
message PresetRef      { int32 target = 1; string name = 2; }   // target = track id or insert index
message PresetCategory { string category = 1; }                 // "synth" | "effects"
message PresetList     { repeated string names = 1; }

// ── track & clip management ────────────────────────────────
message AddAudioTrackRequest   { string name = 1; }                             // empty audio track
message AddSamplerTrackRequest { string name = 1; string path = 2; int32 root_note = 3; }
message SamplerControlsRequest { int32 track_id = 1; float start = 2; float end = 3; bool reverse = 4; int32 root_note = 5; float fade_in = 6; float fade_out = 7; bool loop = 8; }
message SamplerControls { bool ok = 1; float start = 2; float end = 3; bool reverse = 4; int32 root_note = 5; string name = 6; float fade_in = 7; float fade_out = 8; bool loop = 9; }
message AddSfzTrackRequest     { string name = 1; string path = 2; }   // native SFZ instrument
message AddPluginTrackRequest  { string identifier = 1; }                        // PluginInfo.identifier
message ClipRef            { int32 track_id = 1; int32 index = 2; }
message NotesJson          { string json = 1; }
message ImportNotesRequest { int32 track_id = 1; double start_beat = 2; string json = 3; }
message ClipTransposeRequest { int32 track_id = 1; int32 index = 2; int32 semitones = 3; }
message MoveClipRequest    { int32 track_id = 1; int32 index = 2; double start_beat = 3; optional int32 to_track_id = 4; }
message AddAudioClipRequest { int32 track_id = 1; double start_beat = 2; string path = 3; float gain = 4; }

// clip / region operations
message SplitClipRequest     { int32 track_id = 1; int32 index = 2; double beat = 3; }     // beat = absolute split point
message SplitAtMarkerRequest { int32 track_id = 1; int32 index = 2; string marker = 3; }   // split at a named timeline location
message SliceTransientsRequest { int32 track_id = 1; int32 index = 2; float sensitivity = 3; }   // audio clip -> slices at onsets
message ClipMuteRequest      { int32 track_id = 1; int32 index = 2; bool muted = 3; }   // mute/enable a clip in the arrangement
message SliceResult          { int32 slices = 1; }   // number of resulting slices
message DuplicateClipRequest { int32 track_id = 1; int32 index = 2; double at_beat = 3; }   // at_beat<0 => right after
message RepeatClipRequest    { int32 track_id = 1; int32 index = 2; int32 copies = 3; }   // tile N butted copies after the clip
message CropClipRequest      { int32 track_id = 1; int32 index = 2; double start_beat = 3; double end_beat = 4; }  // trim to [start,end)
message ClipGainRequest      { int32 track_id = 1; int32 index = 2; float gain_db = 3; }     // audio clip gain (dB)
message NormalizeClipRequest { int32 track_id = 1; int32 index = 2; float target_dbfs = 3; } // gain so peak=target (0=full scale)
message ClipFadesRequest     { int32 track_id = 1; int32 index = 2; double fade_in_beats = 3; double fade_out_beats = 4; }
message NoteList             { repeated Note notes = 1; }
// piano-roll note-edit ops
message QuantizeRequest  { int32 track_id = 1; int32 index = 2; double grid = 3; }        // grid in beats
message TransposeRequest { int32 track_id = 1; int32 index = 2; int32 semitones = 3; }
message HumanizeRequest  { int32 track_id = 1; int32 index = 2; double timing = 3; double velocity = 4; }
message StrumRequest     { int32 track_id = 1; int32 index = 2; double step_beats = 3; bool down = 4; }   // fan out chord voices
message ArpeggiateRequest{ int32 track_id = 1; int32 index = 2; double step_beats = 3; int32 mode = 4; } // mode 0=up 1=down 2=updown
message SplitNotesRequest{ int32 track_id = 1; int32 index = 2; double beat = 3; }   // knife: cut notes spanning this clip-relative beat
// Live (non-destructive) per-track arpeggiator. mode 0=up 1=down 2=updown 3=random.
message ArpSpec          { int32 track_id = 1; bool enabled = 2; double rate = 3; int32 octaves = 4; float gate = 5; int32 mode = 6; float swing = 7; bool hold = 8; }
message TrackRef2        { int32 track_id = 1; }
// Stamp a chord. type: maj/min/dim/aug/sus2/sus4/6/min6/7/maj7/min7/m7b5/dim7/add9/maj9/min9/5.
message ChordRequest     { int32 track_id = 1; int32 index = 2; int32 root = 3; string type = 4;
                           double start_beat = 5; double length_beats = 6; float velocity = 7; int32 inversion = 8; }

// ── plugins ────────────────────────────────────────────────
message ScanPluginsRequest { bool force = 1; }
message PluginInfo {
  string name = 1; string format = 2; bool is_instrument = 3; string identifier = 4;
  string vendor = 5; string category = 6; string version = 7; int32 num_inputs = 8; int32 num_outputs = 9;
}
message PluginList  { repeated PluginInfo plugins = 1; }
message AddPluginEffectRequest { int32 insert = 1; string identifier = 2; }

// ── automation ─────────────────────────────────────────────
enum AutoTarget { TRACK_VOL = 0; TRACK_PAN = 1; INSERT_VOL = 2; INSERT_PAN = 3; EFFECT_PARAM = 4; }
message AutoPoint { double beat = 1; float value = 2; }
message Automation {
  AutoTarget target = 1;
  int32 id = 2;                 // track id (TRACK_*) or insert index (INSERT_*/EFFECT_PARAM)
  int32 slot = 3;               // effect slot (EFFECT_PARAM)
  string param = 4;             // effect param name (EFFECT_PARAM)
  repeated AutoPoint points = 5;   // empty = clear this lane
  string param_id = 6;          // when set, an id-addressed lane (a ParamModel id) — the unified path
}
message AutomationList { repeated Automation lanes = 1; }
// Append/replace one keyframe on a ParamModel-id-addressed automation lane.
message AddAutoPointRequest { string param_id = 1; double beat = 2; float value = 3; }

// ── modulation matrix ──────────────────────────────────────
// An LFO driving a ParamModel target: value = center + depth*osc(rate*t).
// shape: 0 sine, 1 triangle, 2 saw, 3 square. One LFO per target (upsert).
message ModRoute { string target = 1; float rate = 2; float depth = 3; float center = 4; int32 shape = 5; float sync_beats = 6;   // sync_beats>0: cycle length in beats (tempo-synced)
                   float phase = 7; bool unipolar = 8;   // phase: cycle offset 0..1; unipolar: center..center+depth (one-sided)
                   float slew_ms = 9; }   // >0: one-pole slew time constant (ms) softening value changes
message ModList  { repeated ModRoute mods = 1; }
message ModTarget { string target = 1; }

// ── project / state ────────────────────────────────────────
message FilePath { string path = 1; }
message Tuning   { repeated double cents = 1; }   // 12 pitch-class cents offsets from equal temperament
message TextValue { string text = 1; }   // project notes (markdown)
// Waveform thumbnail: min/max peaks per bucket for an audio file.
message WaveformRequest { string path = 1; int32 buckets = 2; }
message WaveformData    { repeated float mins = 1; repeated float maxs = 2; int32 buckets = 3; double duration_seconds = 4; }
// Offline loudness report (ITU-R BS.1770 / EBU R128).
message LoudnessReport { float peak_dbfs = 1; float true_peak_dbtp = 2; float rms_dbfs = 3; float lufs = 4;
                         float momentary_lufs = 5; float short_term_lufs = 6; float lra = 7; }
// Engine health snapshot.
message Diagnostics {
  double sample_rate = 1; int32 block_size = 2; int32 inputs = 3; int32 outputs = 4;
  double callback_us = 5; double max_callback_us = 6; double dsp_load = 7;
  int64 dropouts = 8; double render_speed_x = 9;   // last offline bounce, x realtime
}
message RenderRequest {                       // offline bounce to WAV
  string path = 1;
  double tail_seconds = 2;
  double start_beat = 3;                      // range start (default 0)
  double end_beat = 4;                        // range end (0 = whole song)
  optional int32 track_id = 5;                // solo this track (stem export)
  string range_name = 6;                      // resolve a named range/section -> start/end (overrides 3/4)
  bool report = 7;                            // also analyse the output and return loudness
}

// RenderToFile result. Wire-compatible with Ack on fields 1/2 (ok/error), plus an
// optional loudness report when RenderRequest.report is set.
message RenderResult { bool ok = 1; string error = 2; LoudnessReport report = 3; }
message ProjectState {
  TransportState transport = 1;
  repeated TrackInfo   tracks  = 2;
  repeated MixerInsert inserts = 3;
}

// ── events (streamed out) ──────────────────────────────────
message SubscribeRequest { bool transport = 1; bool meters = 2; uint32 interval_ms = 3; bool changes = 4; }
// A structural edit: kind is "track_added"|"track_removed"|"clip_changed"|
// "effect_changed"|"project_loaded". track_id/insert set when relevant (else -1).
message ChangeEvent { string kind = 1; int32 track_id = 2; int32 insert = 3; }
// Per insert, [0] = master. Sent unpacked ([packed=false]) so decoders that
// don't implement packed repeated scalars (e.g. ag-proto in the Lisp client)
// read them correctly; standard protobuf decoders accept unpacked too.
message Meters {
  repeated float peak_l = 1 [packed = false];
  repeated float peak_r = 2 [packed = false];
  repeated bool  clipped = 3 [packed = false];   // sticky per-insert clip (>= 0 dBFS)
}
message Event {
  oneof kind {
    TransportState transport = 1;
    Meters         meters    = 2;
    ChangeEvent    change    = 3;
  }
}

// ── service ────────────────────────────────────────────────
service Gloopy {
  // transport
  rpc Play        (Empty)    returns (Ack);
  rpc Stop        (Empty)    returns (Ack);
  rpc SetTempo    (Tempo)    returns (Ack);
  rpc SetSwing    (Swing)    returns (Ack);
  rpc Seek        (Position) returns (Ack);
  rpc SetLoop     (Loop)     returns (Ack);

  // tempo map (model + beat<->seconds helpers; render path not yet tempo-mapped)
  rpc AddTempoMarker    (TempoMarker)  returns (Ack);   // upsert by beat
  rpc RemoveTempoMarker (TempoMarker)  returns (Ack);   // by beat
  rpc ListTempoMarkers  (Empty)        returns (TempoMap);

  // time signature + bars<->beats conversion
  rpc SetTimeSignature (TimeSignature) returns (Ack);
  rpc GetTimeSignature (Empty)         returns (TimeSignature);
  rpc BeatsToBarBeat   (BeatPos)       returns (BarBeat);   // absolute beat -> bar.beat
  rpc BarBeatToBeats   (BarBeat)       returns (BeatPos);
  rpc BeatsToSeconds    (Position)     returns (SecondsValue);
  rpc SecondsToBeats    (SecondsValue) returns (Position);
  rpc GetTransport(Empty)    returns (TransportState);
  rpc StartRecording(Empty)  returns (Ack);   // record armed MIDI + armed audio tracks
  rpc StopRecording (Empty)  returns (Ack);
  rpc ListAudioInputs(Empty) returns (AudioInputs);   // audio recording
  rpc ArmTrack       (ArmRequest) returns (Ack);
  rpc SetPunchRange  (PunchRange) returns (Ack);
  rpc SetRecordSettings(RecordSettings) returns (Ack);   // format + latency offset
  rpc PromoteTake    (TakeRef)   returns (Ack);          // raw/ -> recordings/
  rpc CleanupTakes   (Empty)     returns (TakeCount);    // delete unreferenced takes
  rpc RecoverTakes   (Empty)     returns (TakeCount);    // clip-ify orphan takes

  // tracks
  rpc AddSynthTrack (AddSynthTrackRequest) returns (TrackId);
  rpc SetTrackParams(TrackParams)          returns (Ack);
  rpc SetSynthParam (SynthParamSet)        returns (Ack);   // tweak the built-in synth engine
  rpc ListTracks    (Empty)                returns (TrackList);

  // clips & notes (programmatic sequences)
  rpc AddClip       (AddClipRequest)       returns (ClipId);

  // track & clip management
  rpc RemoveTrack     (TrackId)                returns (Ack);
  rpc AddAudioTrack   (AddAudioTrackRequest)   returns (TrackId);
  rpc AddSamplerTrack (AddSamplerTrackRequest) returns (TrackId);
  rpc SetSamplerControls (SamplerControlsRequest) returns (Ack);
  rpc GetSamplerControls (TrackId) returns (SamplerControls);
  rpc AddSfzTrack     (AddSfzTrackRequest)     returns (TrackId);
  rpc AddPluginTrack  (AddPluginTrackRequest)  returns (TrackId);
  rpc RemoveClip      (ClipRef)                returns (Ack);
  rpc MoveClip        (MoveClipRequest)        returns (Ack);
  rpc AddAudioClip    (AddAudioClipRequest)    returns (ClipId);
  rpc SplitClip       (SplitClipRequest)       returns (ClipId);    // -> new (right) clip
  rpc SplitClipAtMarker(SplitAtMarkerRequest)  returns (ClipId);    // split at a named timeline location
  rpc SliceAtTransients(SliceTransientsRequest) returns (SliceResult);   // audio clip -> slices at detected onsets
  rpc SetClipMuted    (ClipMuteRequest)        returns (Ack);      // mute/enable a clip in the arrangement
  rpc SetLoopToClip   (ClipRef)                returns (Ack);      // loop the transport over a clip's span
  rpc SetMetronome    (MetronomeRequest)       returns (Ack);      // toggle the beat-click metronome
  rpc DuplicateClip   (DuplicateClipRequest)   returns (ClipId);
  rpc RepeatClip      (RepeatClipRequest)      returns (SliceResult);   // SliceResult.slices = copies added
  rpc ReverseClip     (ClipRef)                returns (Ack);
  rpc CropClip        (CropClipRequest)        returns (Ack);      // trim a MIDI clip to a beat range
  rpc ConsolidateClip (ClipRef)                returns (Ack);      // flatten a looped MIDI clip's repetitions into notes
  rpc BounceClip      (ClipRef)                returns (TrackId);  // freeze a clip to audio on a new track (id, or 0 = -1/failed)
  rpc SetClipGain     (ClipGainRequest)        returns (Ack);      // audio clip gain (dB)
  rpc NormalizeClip   (NormalizeClipRequest)   returns (Ack);      // gain so the clip peaks at target dBFS
  rpc SetClipFades    (ClipFadesRequest)       returns (Ack);      // audio clip fade-in / fade-out (beats)
  rpc GetClipNotes    (ClipRef)                returns (NoteList);
  rpc ExportNotesJSON (ClipRef)                returns (NotesJson);
  rpc ImportNotesJSON (ImportNotesRequest)     returns (ClipId);
  rpc SetClipTranspose(ClipTransposeRequest)   returns (Ack);   // non-destructive playback pitch offset
  rpc QuantizeClip    (QuantizeRequest)        returns (Ack);
  rpc TransposeClip   (TransposeRequest)       returns (Ack);
  rpc HumanizeClip    (HumanizeRequest)        returns (Ack);
  rpc AddChord        (ChordRequest)           returns (Ack);   // stamp a chord into a clip
  rpc StrumClip       (StrumRequest)           returns (Ack);   // fan out a chord's voices
  rpc ArpeggiateClip  (ArpeggiateRequest)      returns (Ack);   // chord -> arpeggio (destructive)
  rpc SplitNotesAtBeat(SplitNotesRequest)      returns (Ack);   // knife: split notes crossing a clip-relative beat
  rpc SetTrackArp     (ArpSpec)                returns (Ack);   // live per-track arpeggiator
  rpc GetTrackArp     (TrackRef2)              returns (ArpSpec);

  // plugins
  rpc ScanPlugins     (ScanPluginsRequest)     returns (PluginList);
  rpc ListPlugins     (Empty)                  returns (PluginList);
  rpc AddPluginEffect (AddPluginEffectRequest) returns (EffectRef);
  rpc OpenPluginEditor(TrackId)                returns (Ack);

  // mixer & effects
  rpc ListInserts    (Empty)            returns (InsertList);
  rpc SetInsertParams(InsertParams)     returns (Ack);
  rpc AddEffect      (AddEffectRequest) returns (EffectRef);
  rpc RemoveEffect   (EffectRef)        returns (Ack);
  rpc SetEffectParam (EffectParamSet)   returns (Ack);
  rpc SetEffectBypass(EffectBypassSet)  returns (Ack);
  rpc GetEffectParams(EffectRef)        returns (ParamList);

  // buses & sends
  rpc AddBus  (AddBusRequest)  returns (TrackId);    // TrackId.id = the new bus's insert index
  rpc RemoveBus (TrackId)      returns (Ack);        // TrackId.id = the bus's insert index; re-indexes sends
  rpc SetSend (SetSendRequest) returns (Ack);

  // control groups (VCA-lite) — a group fader that scales its member inserts
  rpc DefineControlGroup  (ControlGroupGain) returns (Ack);   // upsert a group with a gain
  rpc SetControlGroupGain (ControlGroupGain) returns (Ack);   // set an existing group's fader
  rpc SetControlGroupMute (ControlGroupMute) returns (Ack);
  rpc AssignInsertToGroup (GroupAssign)      returns (Ack);   // group="" clears membership
  rpc RemoveControlGroup  (GroupName)        returns (Ack);
  rpc ListControlGroups   (Empty)            returns (ControlGroupList);

  // mixer scenes — named snapshots of the mixer strip (recall on demand)
  rpc DefineMixerScene(SceneName) returns (Ack);   // snapshot current mixer (upsert)
  rpc ListMixerScenes (Empty)     returns (SceneList);
  rpc RecallMixerScene(SceneName) returns (Ack);
  rpc RemoveMixerScene(SceneName) returns (Ack);

  // presets (instrument sound / effect chain, as composition-friendly TOML)
  rpc ListPresets     (PresetCategory)  returns (PresetList);
  rpc SaveSynthPreset (PresetRef)       returns (Ack);
  rpc LoadSynthPreset (PresetRef)       returns (Ack);
  rpc SaveInstrumentPreset(PresetRef)   returns (Ack);   // synth or SFZ instrument
  rpc LoadInstrumentPreset(PresetRef)   returns (Ack);
  rpc SaveEffectPreset(PresetRef)       returns (Ack);
  rpc LoadEffectPreset(PresetRef)       returns (Ack);

  // automation
  rpc SetAutomation  (Automation)       returns (Ack);
  rpc AddAutomationPoint (AddAutoPointRequest) returns (Ack);   // append/replace a keyframe on an id-addressed lane
  rpc GetAutomation  (Empty)            returns (AutomationList);

  // modulation matrix (LFO -> ParamModel target)
  rpc SetModulation    (ModRoute)  returns (Ack);   // canonical single set (replaces any on the target)
  rpc AddModulation    (ModRoute)  returns (Ack);   // append an additional source (sources on one target sum)
  rpc RemoveModulation (ModTarget) returns (Ack);
  rpc ListModulations  (Empty)     returns (ModList);

  // universal parameter model — one flat, stable, string-addressed view of every
  // automatable value (see ParameterInfo.id grammar).
  rpc ListParameters (Empty)         returns (ParameterList);
  rpc GetParameter   (ParameterId)   returns (ParameterInfo);
  rpc SetParameter   (ParameterSet)  returns (Ack);
  rpc SetParameterNormalized (ParameterSet) returns (Ack);   // value is a 0..1 knob position; mapped through the param's scaling

  // controller mapping / MIDI-learn (source -> ParamModel target)
  rpc AddControllerMap    (ControllerMap)   returns (Ack);
  rpc RemoveControllerMap (ControllerSource) returns (Ack);
  rpc ListControllerMaps  (Empty)           returns (ControllerList);
  rpc SetController       (ControllerValue) returns (Ack);   // feed a source (0..1); MIDI CC / OSC feed the same path
  rpc SetControllerBypass (ControllerBypass) returns (Ack);  // enable/disable a map without removing it
  rpc MidiLearn           (LearnRequest)    returns (Ack);

  // scales — project scale + snap-to-scale
  rpc SetScale        (Scale)   returns (Ack);
  rpc GetScale        (Empty)   returns (Scale);
  rpc SetTuning       (Tuning)  returns (Ack);      // 12 cents offsets from equal temperament
  rpc GetTuning       (Empty)   returns (Tuning);
  rpc ImportScl       (FilePath) returns (Ack);     // load a Scala .scl tuning file
  rpc SnapClipToScale (ClipRef) returns (Ack);

  // timeline locations — named markers / ranges / sections
  rpc AddLocation    (TimelineLocation) returns (Ack);   // upsert by name
  rpc ListLocations  (Empty)            returns (LocationList);
  rpc RemoveLocation (LocationName)     returns (Ack);

  // export profiles — named render targets
  rpc DefineExportProfile (ExportProfile) returns (Ack);   // upsert by name
  rpc ListExportProfiles  (Empty)         returns (ExportProfileList);
  rpc RemoveExportProfile (ExportName)    returns (Ack);
  rpc RunExport           (ExportRun)     returns (ExportResult);

  // project & state
  rpc GetState      (Empty) returns (ProjectState);
  rpc GetDiagnostics(Empty) returns (Diagnostics);   // engine health / RT metrics
  rpc SetProjectNotes(TextValue) returns (Ack);      // free-form markdown, saved with the song
  rpc GetProjectNotes(Empty)     returns (TextValue);
  rpc NewProject (Empty)    returns (Ack);
  rpc ListTemplates  (Empty)       returns (TemplateList);   // built-in + user project templates
  rpc NewFromTemplate(TemplateRef) returns (Ack);            // empty + seed a template
  rpc SaveAsTemplate (TemplateRef) returns (Ack);            // save the current project as a user template
  rpc Undo       (Empty)    returns (Ack);
  rpc Redo       (Empty)    returns (Ack);
  rpc LoadProject(FilePath) returns (Ack);
  rpc SaveProject(FilePath) returns (Ack);
  rpc SaveComposition(FilePath) returns (Ack);   // directory "composition as repo" format
  rpc LoadComposition(FilePath) returns (Ack);
  rpc RenderToFile(RenderRequest) returns (RenderResult);   // offline bounce (+ optional loudness report)
  rpc ExportMidi (FilePath) returns (Ack);         // all instrument tracks -> Type-1 SMF
  rpc ImportMidi (FilePath) returns (Ack);         // SMF -> synth tracks + clips
  rpc ImportAudio (FilePath) returns (Ack);        // wav/aiff/flac -> a new audio track
  rpc AnalyzeFile(FilePath) returns (LoudnessReport);   // offline peak/true-peak/RMS/LUFS
  rpc GetWaveform(WaveformRequest) returns (WaveformData);   // cached min/max thumbnail peaks

  // events (playhead, meters) — closed-loop control
  rpc Subscribe  (SubscribeRequest) returns (stream Event);
}
